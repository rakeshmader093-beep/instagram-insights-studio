plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.insightsstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.insightsstudio.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
